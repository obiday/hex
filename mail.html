<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail 10 Phút</title>
    <style>
        /* CSS Tối giản, tốc độ tải siêu nhanh */
        :root { --bg: #0f0f0f; --text: #e0e0e0; --box: #1a1a1a; --border: #333; --accent: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background: var(--bg); color: var(--text); padding: 15px; display: flex; justify-content: center; min-height: 100vh; }
        
        .container { width: 100%; max-width: 500px; background: var(--box); border: 1px solid var(--border); padding: 20px; align-self: flex-start; margin-top: 20px; }
        .header { text-align: center; border-bottom: 1px dashed var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .header h2 { font-size: 20px; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
        .header span { font-size: 12px; color: #888; }
        
        input { width: 100%; padding: 15px; background: #000; color: #fff; border: 1px solid var(--border); margin-bottom: 12px; font-size: 16px; font-weight: bold; text-align: center; outline: none; }
        input:focus { border-color: #666; }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        button { flex: 1; padding: 12px; border: 1px solid var(--border); background: #222; color: #fff; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        button:hover, button:active { background: #fff; color: #000; border-color: #fff; }
        
        #status { font-size: 12px; color: #aaa; text-align: center; margin-bottom: 15px; height: 15px; }
        
        .inbox { border-top: 1px dashed var(--border); padding-top: 15px; min-height: 250px; }
        .mail-item { background: #000; border: 1px solid var(--border); padding: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .mail-item:hover, .mail-item:active { border-color: #666; background: #111; }
        .mail-item .from { font-weight: bold; color: var(--accent); margin-bottom: 5px; font-size: 14px; word-break: break-all; }
        .mail-item .subject { font-size: 13px; color: #aaa; }
        .empty { text-align: center; color: #666; font-style: italic; padding: 30px 0; }
        
        #reader { display: none; }
        .btn-back { width: 100%; margin-bottom: 15px; background: #fff; color: #000; }
        iframe { width: 100%; height: 400px; background: #fff; border: 1px solid var(--border); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Hệ Thống Mail 10 Phút</h2>
            <span>[ HOSTED ON GITHUB PAGES ]</span>
        </div>
        
        <input type="text" id="email" readonly value="Đang tạo hệ thống...">
        
        <div class="btn-group">
            <button onclick="copyMail()" id="btnCopy">Sao Chép</button>
            <button onclick="initMail()">Đổi Mail</button>
        </div>

        <div id="status">Khởi động...</div>

        <!-- Danh sách thư -->
        <div id="inbox" class="inbox">
            <div class="empty">Đang chờ thư đến...</div>
        </div>

        <!-- Khung đọc thư -->
        <div id="reader">
            <button class="btn-back" onclick="closeMail()">&#8592; Quay lại hộp thư</button>
            <iframe id="mailFrame"></iframe>
        </div>
    </div>

    <script>
        const API_BASE = "https://www.1secmail.com/api/v1/";
        const PROXY = "https://api.allorigins.win/raw?url=";
        let address = "", login = "", domain = "";
        let checkTimer;
        let countdown = 10;

        // Tối ưu hàm fetch: Gọi trực tiếp, nếu lỗi tự động đổi qua Proxy
        async function fetchAPI(endpoint) {
            let url = API_BASE + endpoint;
            try {
                let res = await fetch(url);
                if (res.ok) return await res.json();
                throw new Error("Direct API failed");
            } catch (e) {
                try {
                    let proxyRes = await fetch(PROXY + encodeURIComponent(url));
                    if (proxyRes.ok) return await proxyRes.json();
                } catch (err) {
                    console.error(err);
                }
            }
            return null;
        }

        async function initMail() {
            document.getElementById('email').value = "Đang cấp phát email...";
            document.getElementById('status').innerText = "Đang kết nối máy chủ...";
            clearInterval(checkTimer);
            
            let data = await fetchAPI("?action=genRandomMailbox&count=1");
            if (data && data[0]) {
                address = data[0];
                document.getElementById('email').value = address;
                [login, domain] = address.split('@');
                
                closeMail();
                document.getElementById('inbox').innerHTML = '<div class="empty">Đang chờ thư đến...</div>';
                
                countdown = 10;
                checkTimer = setInterval(autoCheck, 1000);
            } else {
                document.getElementById('email').value = "LỖI KẾT NỐI";
                document.getElementById('status').innerText = "Không thể tải API. Vui lòng thử lại.";
            }
        }

        async function autoCheck() {
            countdown--;
            document.getElementById('status').innerText = `Làm mới hộp thư sau ${countdown}s...`;
            
            if (countdown <= 0) {
                countdown = 10;
                document.getElementById('status').innerText = "Đang quét thư mới...";
                
                let emails = await fetchAPI(`?action=getMessages&login=${login}&domain=${domain}`);
                
                if (emails) {
                    let inboxDiv = document.getElementById('inbox');
                    if (emails.length === 0) {
                        inboxDiv.innerHTML = '<div class="empty">Đang chờ thư đến...</div>';
                    } else {
                        inboxDiv.innerHTML = "";
                        emails.forEach(msg => {
                            let div = document.createElement('div');
                            div.className = 'mail-item';
                            div.onclick = () => readMail(msg.id);
                            div.innerHTML = `
                                <div class="from">Từ: ${escapeHTML(msg.from)}</div>
                                <div class="subject">Tiêu đề: ${escapeHTML(msg.subject) || "(Không có)"}</div>
                            `;
                            inboxDiv.appendChild(div);
                        });
                    }
                }
            }
        }

        async function readMail(id) {
            clearInterval(checkTimer);
            document.getElementById('inbox').style.display = 'none';
            document.getElementById('reader').style.display = 'block';
            document.getElementById('status').innerText = "Đang tải nội dung thư...";

            let mailData = await fetchAPI(`?action=readMessage&login=${login}&domain=${domain}&id=${id}`);
            
            if (mailData) {
                document.getElementById('status').innerText = "Tải thành công.";
                let content = mailData.htmlBody || `<pre style="padding:15px; font-family:sans-serif; font-size:14px; white-space:pre-wrap;">${mailData.textBody}</pre>`;
                
                let doc = document.getElementById('mailFrame').contentWindow.document;
                doc.open();
                doc.write(content);
                doc.close();
            } else {
                document.getElementById('status').innerText = "Lỗi khi mở thư!";
            }
        }

        function closeMail() {
            document.getElementById('reader').style.display = 'none';
            document.getElementById('inbox').style.display = 'block';
            countdown = 5; 
            clearInterval(checkTimer);
            checkTimer = setInterval(autoCheck, 1000);
            document.getElementById('status').innerText = "Đã quay lại hộp thư.";
        }

        function copyMail() {
            let emailInput = document.getElementById('email');
            if(emailInput.value.includes("LỖI") || emailInput.value.includes("Đang")) return;
            
            emailInput.select();
            emailInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(emailInput.value);
            
            let btn = document.getElementById('btnCopy');
            btn.innerText = "ĐÃ COPY";
            btn.style.background = "#fff";
            btn.style.color = "#000";
            
            setTimeout(() => {
                btn.innerText = "SAO CHÉP";
                btn.style.background = "#222";
                btn.style.color = "#fff";
            }, 1500);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        window.onload = initMail;
    </script>
</body>
</html>
