<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Name Patcher & Donate 🧋</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-page: #F5EAE0;
            --card-bg: rgba(255, 252, 248, 0.95);
            --text-main: #5C4B41;
            --text-muted: #8C7B70;
            --primary: #C69C85; 
            --primary-hover: #B0856D;
            --success: #8BA888; 
            --success-hover: #728F6F;
            --danger: #D28F8F;
            --input-bg: #FDF8F5;
            --tab-active: #9E877A;
            --tab-inactive: #D7C6B8;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #F5EAE0 0%, #EAD7C3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: var(--text-main);
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 25px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(92, 75, 65, 0.1);
            width: 100%;
            max-width: 520px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            display: flex;
            flex-direction: column;
            min-height: 650px;
            height: auto;
        }

        /* TABS */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(198, 156, 133, 0.2);
            padding-bottom: 10px;
        }

        .tab-btn {
            flex: 1; background: none; border: none;
            font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800;
            color: var(--tab-inactive); cursor: pointer; padding: 12px;
            border-radius: 12px; transition: all 0.3s;
        }

        .tab-btn.active { color: #fff; background: var(--tab-active); box-shadow: 0 4px 10px rgba(158, 135, 122, 0.3); }
        .tab-content { display: none; flex-direction: column; animation: fadeIn 0.4s ease; flex-grow: 1; }
        .tab-content.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { margin: 0 0 5px 0; font-size: 24px; font-weight: 800; text-align: center; }
        p.subtitle { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 20px; font-weight: 600; }

        /* UPLOAD & FORM SỬA TÊN */
        .file-upload label {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: var(--primary); color: #fff; padding: 15px;
            border-radius: 15px; cursor: pointer; font-weight: 800; font-size: 15px; transition: 0.3s;
        }
        .file-upload label:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .file-upload input[type="file"] { display: none; }
        #fileName { display: block; text-align: center; margin-top: 10px; font-size: 14px; font-weight: 700; color: var(--primary-hover); }

        .box-section {
            background: rgba(255, 255, 255, 0.6); padding: 20px; border-radius: 18px; border: 1px dashed var(--primary);
            display: none; flex-direction: column; gap: 15px; margin-top: 10px;
        }

        .input-group label { font-size: 14px; font-weight: 800; margin-bottom: 8px; display: block; }
        .input-with-btn { display: flex; gap: 10px; }
        
        input[type="text"], input[type="number"] {
            flex: 1; padding: 14px; border-radius: 12px;
            border: 2px solid rgba(198, 156, 133, 0.3); background: var(--input-bg);
            font-family: 'Fira Code', monospace; font-size: 15px; font-weight: 600; outline: none; transition: 0.3s;
        }
        input[type="text"]:focus, input[type="number"]:focus { border-color: var(--primary); }
        input:disabled { background: #eaeaea; cursor: not-allowed; border-color: transparent; }

        button.btn-search { background: var(--text-muted); color: white; border: none; padding: 0 18px; border-radius: 12px; font-weight: 800; cursor: pointer; }
        button.btn-search:hover { background: var(--text-main); }
        .status-box { font-size: 14px; font-weight: 700; display: none; align-items: center; gap: 6px; }
        
        .counter { font-size: 13px; font-weight: 800; text-align: right; margin-top: 5px; }
        .counter.match { color: var(--success); }
        .counter.warning { color: #D98C00; }
        .counter.error { color: var(--danger); }

        /* GIAO DIỆN HEX VIEWER (CHUẨN iOS FILZA) */
        .hex-viewer-container {
            display: none;
            background: #000000; /* Nền đen tuyền */
            border-radius: 12px;
            padding: 15px 20px;
            margin-top: 5px;
            overflow-x: auto;
            text-align: left; /* Căn trái */
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .hex-header {
            font-size: 12px; color: #fff; font-weight: 700; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            opacity: 0.7;
        }
        
        .hex-body {
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            color: #ffffff;
            white-space: pre;
            line-height: 1.6;
        }

        .hex-offset {
            color: #5B85D9; /* Màu xanh dương đặc trưng của Offset iOS */
            margin-right: 20px;
        }
        
        .hex-highlight {
            color: #FF3B30; /* Đỏ tươi nổi bật chữ tìm thấy */
            font-weight: bold;
            background: rgba(255, 59, 48, 0.2);
            border-radius: 3px;
        }

        .btn-save {
            background: var(--success); color: white; border: none; padding: 16px; margin-top: 5px;
            border-radius: 15px; font-size: 16px; font-weight: 800; font-family: 'Nunito', sans-serif; cursor: pointer; transition: 0.3s;
        }
        .btn-save:hover:not(:disabled) { background: var(--success-hover); transform: translateY(-2px); }
        .btn-save:disabled { background: #ccc; cursor: not-allowed; }

        /* FORM TẠO QR ĐỘNG */
        .qr-generator {
            background: rgba(255, 255, 255, 0.7); border-radius: 18px; padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px;
            border: 1px solid rgba(198, 156, 133, 0.2);
        }
        .qr-generator h3 { margin: 0 0 15px 0; font-size: 17px; color: var(--text-main); text-align: center; }
        
        .form-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .form-row input { font-family: 'Nunito', sans-serif; padding: 12px; width: 100%; box-sizing: border-box; font-size: 14px; }
        
        .btn-generate {
            background: var(--primary); color: white; border: none; width: 100%; padding: 14px;
            border-radius: 12px; font-size: 15px; font-weight: 800; font-family: 'Nunito', sans-serif;
            cursor: pointer; transition: 0.3s; margin-top: 5px;
        }
        .btn-generate:hover { background: var(--primary-hover); transform: translateY(-2px); }

        .qr-result {
            display: none; text-align: center; margin-top: 15px; padding-top: 15px;
            border-top: 1px dashed var(--primary); animation: fadeIn 0.4s ease;
        }
        .qr-result img { width: 100%; max-width: 240px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .qr-result p { font-size: 13px; font-weight: 700; color: var(--text-main); margin-top: 10px; }

        /* TOP DONATE */
        .top-donate-box {
            background: rgba(255, 255, 255, 0.8); border-radius: 18px; padding: 20px; flex-grow: 1;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02); border: 1px solid rgba(198, 156, 133, 0.2);
        }
        .top-donate-box h3 { margin: 0 0 15px 0; font-size: 18px; color: var(--text-main); text-align: center; font-weight: 800; }
        
        .donate-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
        
        .donate-item {
            display: flex; align-items: center; justify-content: space-between;
            background: #fff; padding: 12px 15px; border-radius: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04); border: 1px solid rgba(198, 156, 133, 0.15);
            transition: transform 0.2s;
        }
        .donate-item:hover { transform: scale(1.02); }
        
        .donate-rank { width: 35px; text-align: center; flex-shrink: 0; }
        .rank-1 { color: #FFD700; font-size: 22px; text-shadow: 0 2px 5px rgba(255,215,0,0.4); }
        .rank-2 { color: #C0C0C0; font-size: 22px; text-shadow: 0 2px 5px rgba(192,192,192,0.4); }
        .rank-3 { color: #CD7F32; font-size: 22px; text-shadow: 0 2px 5px rgba(205,127,50,0.4); }
        .rank-text { color: #999; font-weight: 800; font-size: 16px; }
        
        .donate-info { flex-grow: 1; display: flex; flex-direction: column; margin-left: 5px; overflow: hidden; }
        .donate-name { font-size: 14px; font-weight: 800; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .donate-msg { font-size: 12px; font-weight: 600; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;}
        
        .donate-amount {
            color: var(--success); font-family: 'Fira Code', monospace; 
            font-size: 15px; font-weight: 800; text-align: right; margin-left: 10px; flex-shrink: 0;
        }
        
        .loading-text { text-align: center; font-size: 14px; color: var(--text-muted); font-weight: 700; padding: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(this, 'editTab')">
            <i class="fa-solid fa-file-signature"></i> Hex Patcher
        </button>
        <button class="tab-btn" onclick="switchTab(this, 'donateTab')">
            <i class="fa-solid fa-crown"></i> Bảng Vàng
        </button>
    </div>

    <!-- TAB 1: SỬA TÊN -->
    <div id="editTab" class="tab-content active">
        <h2>0704Cheat - Patch</h2>
        <p class="subtitle">Hex Edit File 1.0.0</p>

        <div class="file-upload">
            <label for="fileInput"><i class="fa-solid fa-folder-open"></i> Chọn file .bytes / .txt</label>
            <input type="file" id="fileInput">
            <span id="fileName">Chưa có file nào được nạp</span>
        </div>

        <div class="box-section" id="boxSection">
            <div class="input-group">
                <label>1. Tên cũ cần thay:</label>
                <div class="input-with-btn">
                    <input type="text" id="oldNameInput" placeholder="VD: 0704">
                    <button class="btn-search" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i> Tìm</button>
                </div>
            </div>

            <div class="status-box" id="statusBox">
                <i class="fa-solid fa-circle-check"></i> <span id="statusText"></span>
            </div>

            <!-- HEX VIEWER (2 CỘT: OFFSET & STRING) -->
            <div class="hex-viewer-container" id="hexViewerContainer">
                <div class="hex-header">
                    <span><i class="fa-solid fa-search"></i> Memory Search Result</span>
                </div>
                <div class="hex-body" id="hexBody"></div>
            </div>

            <div class="input-group" style="margin-top: 5px;">
                <label>2. Tên mới (Sẽ tự bù Null nếu ngắn hơn):</label>
                <input type="text" id="newNameInput" placeholder="Nhập tên..." disabled>
                <div class="counter match" id="charCounter">0/0 kí tự</div>
            </div>

            <button class="btn-save" id="saveBtn" disabled>
                <i class="fa-solid fa-download"></i> Lưu File Đã Fix
            </button>
        </div>
    </div>

    <!-- TAB 2: DONATE -->
    <div id="donateTab" class="tab-content">
        
        <div class="qr-generator">
            <h3><i class="fa-solid fa-gift" style="color: var(--primary);"></i> Tạo Mã Donate Kèm Lời Nhắn</h3>
            <div class="form-row">
                <input type="number" id="donateAmount" placeholder="Số tiền (Tùy tâm, VD: 20000)">
            </div>
            <div class="form-row" style="flex-direction: column;">
                <input type="text" id="donateName" placeholder="Tên hiển thị của bạn" maxlength="15">
                <input type="text" id="donateMessage" placeholder="Lời nhắn gửi (Tùy chọn)" maxlength="35">
            </div>
            
            <button class="btn-generate" onclick="generateDonateQR()">
                <i class="fa-solid fa-qrcode"></i> Tạo Mã & Hiện QR
            </button>

            <div class="qr-result" id="qrResultArea">
                <img id="qrImage" src="" alt="Mã QR Chuyển khoản">
                <p><i class="fa-solid fa-camera"></i> Hãy quét mã này bằng App Ngân Hàng</p>
            </div>
        </div>

        <div class="top-donate-box">
            <h3><i class="fa-solid fa-trophy" style="color: #FFD700;"></i> TOP DONATE QUA WEB</h3>
            <div id="loadingDonate" class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu lịch sử...</div>
            <ul class="donate-list" id="donateList"></ul>
        </div>
    </div>
</div>

<script>
    function switchTab(btn, tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        
        if(tabId === 'donateTab' && !isFetchedDonate) fetchTopDonate();
    }

    // --- PHẦN 1: LOGIC SỬA TÊN & HEX VIEWER ---
    const fileInput = document.getElementById('fileInput');
    const boxSection = document.getElementById('boxSection');
    const oldNameInput = document.getElementById('oldNameInput');
    const searchBtn = document.getElementById('searchBtn');
    const statusBox = document.getElementById('statusBox');
    const statusText = document.getElementById('statusText');
    const newNameInput = document.getElementById('newNameInput');
    const charCounter = document.getElementById('charCounter');
    const saveBtn = document.getElementById('saveBtn');
    
    const hexViewerContainer = document.getElementById('hexViewerContainer');
    const hexBody = document.getElementById('hexBody');

    let fileBuffer = null;
    let foundOffsets = [];
    let currentFileName = '';
    let targetLength = 0;
    const encoder = new TextEncoder();
    
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        currentFileName = file.name;
        document.getElementById('fileName').innerHTML = `<i class="fa-solid fa-check"></i> Đang xử lý: ${currentFileName}`;
        
        const reader = new FileReader();
        reader.onload = function(event) {
            fileBuffer = event.target.result; 
            boxSection.style.display = 'flex';
            statusBox.style.display = 'none';
            hexViewerContainer.style.display = 'none';
            newNameInput.disabled = true;
            saveBtn.disabled = true;
            newNameInput.value = '';
            charCounter.textContent = '0/0 kí tự';
        };
        reader.readAsArrayBuffer(file);
    });

    searchBtn.addEventListener('click', function() {
        const oldName = oldNameInput.value;
        if (!oldName) return;
        const searchBytes = encoder.encode(oldName);
        targetLength = searchBytes.length;
        
        const uint8 = new Uint8Array(fileBuffer);
        foundOffsets = [];
        for (let i = 0; i <= uint8.length - targetLength; i++) {
            let match = true;
            for (let j = 0; j < targetLength; j++) {
                if (uint8[i + j] !== searchBytes[j]) { match = false; break; }
            }
            if (match) foundOffsets.push(i);
        }

        statusBox.style.display = 'flex';
        if (foundOffsets.length > 0) {
            statusBox.style.color = 'var(--success)';
            statusText.innerHTML = `Đã tìm thấy: <b>${oldName}</b> (ở ${foundOffsets.length} chỗ)`;
            
            // Render Hex Dump
            renderHexDump(fileBuffer, foundOffsets[0], targetLength);

            newNameInput.disabled = false;
            newNameInput.value = '';
            validateAndPad();
        } else {
            statusBox.style.color = 'var(--danger)';
            statusText.innerHTML = `Không tìm thấy trong file!`;
            hexViewerContainer.style.display = 'none';
            newNameInput.disabled = true;
        }
    });

    function renderHexDump(buffer, offset, matchLen) {
        const uint8 = new Uint8Array(buffer);
        let start = Math.max(0, offset - 16);
        start = Math.floor(start / 8) * 8; 
        let end = Math.min(uint8.length, start + 64);

        let hexHTML = '';

        for (let i = start; i < end; i += 8) {
            let rowOffset = i.toString(16).padStart(8, '0').toUpperCase();
            let rowAscii = '';

            for (let j = 0; j < 8; j++) {
                if (i + j < uint8.length) {
                    let byte = uint8[i + j];
                    let isMatchArea = (i + j >= offset && i + j < offset + matchLen);

                    let asciiChar = '.';
                    if (byte >= 32 && byte <= 126) asciiChar = String.fromCharCode(byte);
                    if (asciiChar === '<') asciiChar = '&lt;';
                    if (asciiChar === '>') asciiChar = '&gt;';

                    if (isMatchArea) {
                        rowAscii += `<span class="hex-highlight">${asciiChar}</span> `;
                    } else {
                        rowAscii += `${asciiChar} `;
                    }
                }
            }
            hexHTML += `<span class="hex-offset">${rowOffset}</span>${rowAscii.trimEnd()}\n`;
        }

        hexBody.innerHTML = hexHTML;
        hexViewerContainer.style.display = 'block';
    }

    newNameInput.addEventListener('input', validateAndPad);

    function validateAndPad() {
        const newBytes = encoder.encode(newNameInput.value);
        const len = newBytes.length;

        if (len === targetLength) {
            charCounter.textContent = `${len}/${targetLength} kí tự`;
            charCounter.className = 'counter match';
            saveBtn.disabled = false;
        } else if (len < targetLength) {
            charCounter.textContent = `${len}/${targetLength} kí tự`;
            charCounter.className = 'counter warning';
            saveBtn.disabled = false; 
        } else {
            charCounter.textContent = `${len}/${targetLength} kí tự (Quá giới hạn!)`;
            charCounter.className = 'counter error';
            saveBtn.disabled = true; 
        }
    }

    saveBtn.addEventListener('click', function() {
        const inputBytes = encoder.encode(newNameInput.value);
        const outputUint8 = new Uint8Array(fileBuffer.slice(0));
        let finalBytes = new Uint8Array(targetLength);
        for(let i = 0; i < targetLength; i++) {
            if(i < inputBytes.length) finalBytes[i] = inputBytes[i];
            else finalBytes[i] = 0x00; 
        }
        foundOffsets.forEach(offset => {
            for (let i = 0; i < targetLength; i++) { outputUint8[offset + i] = finalBytes[i]; }
        });

        const blob = new Blob([outputUint8], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "FixedName_" + currentFileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });

    // --- PHẦN 2: TẠO QR (ĐÃ FIX LỖI) & LỌC DỮ LIỆU TỪ WEB ---
    function generateDonateQR() {
        const amountInput = document.getElementById('donateAmount').value;
        // Chỉ lấy số, nếu không nhập thì để null
        const amount = amountInput ? parseInt(amountInput) : null; 
        
        let name = document.getElementById('donateName').value.trim();
        let message = document.getElementById('donateMessage').value.trim();
        
        if (!name) name = "An Danh";
        
        let rawContent = `DONATE0704 ${name}`;
        if (message) rawContent += ` ${message}`; // Bỏ dấu gạch ngang (-) để an toàn

        // Lọc tiếng Việt và CHỈ giữ lại chữ cái, số, khoảng trắng
        const safeContent = rawContent.normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/đ/g, 'd').replace(/Đ/g, 'D')
            .replace(/[^a-zA-Z0-9 ]/g, '') // Xóa các ký tự đặc biệt
            .trim();

        // Sử dụng URLSearchParams để build URL an toàn
        const baseUrl = 'https://img.vietqr.io/image/MB-0374583885-compact2.png';
        const params = new URLSearchParams();
        
        // Nếu có nhập số tiền > 0 thì mới thêm tham số amount
        if (amount && amount > 0) {
            params.append('amount', amount);
        }
        
        params.append('addInfo', safeContent);
        params.append('accountName', 'NGO SON LAM');

        // Tạo URL cuối cùng
        const qrUrl = `${baseUrl}?${params.toString()}`;
        
        document.getElementById('qrImage').src = qrUrl;
        document.getElementById('qrResultArea').style.display = 'block';
    }

    let isFetchedDonate = false;
    const _0xT = ['Mzc3NmEwYmUwMG', 'FlNTU3Yjg4ZTdjND', 'FmNWY5OGMwNmM='];

    async function fetchTopDonate() {
        isFetchedDonate = true;
        const listUI = document.getElementById('donateList');
        const loader = document.getElementById('loadingDonate');

        try {
            const secretToken = atob(_0xT.join('')); 
            const response = await fetch(`https://api.sieuthicode.net/historyapimbbank/${secretToken}`);
            const json = await response.json();
            
            let transactions = json.TranList || [];
            
            transactions = transactions.filter(t => 
                Number(t.creditAmount) > 0 && 
                t.description && 
                t.description.includes("DONATE0704")
            );

            if (transactions.length === 0) {
                loader.innerHTML = "Chưa có ai Donate qua web này. Hãy là người đầu tiên!";
                return;
            }

            transactions.sort((a, b) => Number(b.creditAmount) - Number(a.creditAmount));
            const top5 = transactions.slice(0, 5);

            loader.style.display = 'none';
            listUI.innerHTML = '';

            top5.forEach((gd, index) => {
                let rankIcon = '';
                if (index === 0) rankIcon = '<i class="fa-solid fa-crown rank-1"></i>';
                else if (index === 1) rankIcon = '<i class="fa-solid fa-medal rank-2"></i>';
                else if (index === 2) rankIcon = '<i class="fa-solid fa-award rank-3"></i>';
                else rankIcon = `<span class="rank-text">#${index+1}</span>`;

                const rawAmount = Number(gd.creditAmount);
                const amountFormatted = rawAmount.toLocaleString('vi-VN') + 'đ';
                
                const desc = gd.description;
                let displayName = "Ẩn Danh";
                let displayMsg = "";

                const keywordIdx = desc.indexOf("DONATE0704");
                if (keywordIdx !== -1) {
                    let extracted = desc.substring(keywordIdx + 11).trim(); 
                    const parts = extracted.split(" - ");
                    displayName = parts[0] || "Ẩn Danh";
                    if (parts.length > 1) {
                        displayMsg = parts.slice(1).join(" - "); 
                    }
                }

                const msgHtml = displayMsg ? `<div class="donate-msg"><i class="fa-regular fa-comment-dots"></i> ${displayMsg}</div>` : '';

                listUI.innerHTML += `
                    <li class="donate-item">
                        <div class="donate-rank">${rankIcon}</div>
                        <div class="donate-info">
                            <div class="donate-name">${displayName}</div>
                            ${msgHtml}
                        </div>
                        <div class="donate-amount">+${amountFormatted}</div>
                    </li>
                `;
            });

        } catch (error) {
            console.error("API Error: ", error);
            loader.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:var(--danger)"></i> Lỗi tải dữ liệu. Vui lòng thử lại sau.';
        }
    }
</script>

</body>
</html>
