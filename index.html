<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0704Cheat - Nhận Key & Donate 🧋</title>
    <!-- Thư viện Font & Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Thư viện Pháo Hoa -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --bg-page: #F5EAE0;
            --card-bg: rgba(255, 252, 248, 0.95);
            --text-main: #5C4B41;
            --text-muted: #8C7B70;
            --primary: #C69C85; 
            --primary-hover: #B0856D;
            --success: #8BA888; 
            --success-hover: #728F6F;
            --danger: #D28F8F;
            --input-bg: #FDF8F5;
            --tab-active: #9E877A;
            --tab-inactive: #D7C6B8;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #F5EAE0 0%, #EAD7C3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            color: var(--text-main);
            font-size: 13px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 20px 25px; 
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(92, 75, 65, 0.1);
            width: 100%;
            max-width: 480px; 
            border: 2px solid rgba(255, 255, 255, 0.7);
            display: flex;
            flex-direction: column;
            min-height: 600px;
        }

        /* TABS */
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; border-bottom: 2px solid rgba(198, 156, 133, 0.2); padding-bottom: 10px; }
        .tab-btn {
            flex: 1; background: none; border: none; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800;
            color: var(--tab-inactive); cursor: pointer; padding: 10px; border-radius: 10px; transition: all 0.3s;
        }
        .tab-btn.active { color: #fff; background: var(--tab-active); box-shadow: 0 4px 10px rgba(158, 135, 122, 0.3); }
        .tab-content { display: none; flex-direction: column; animation: fadeIn 0.4s ease; flex-grow: 1; }
        .tab-content.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        h2 { margin: 0 0 5px 0; font-size: 20px; font-weight: 900; text-align: center; } 
        p.subtitle { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 15px; font-weight: 700; } 

        /* NHẬN KEY CSS */
        .key-container { background: rgba(255, 255, 255, 0.6); padding: 25px 20px; border-radius: 15px; border: 1px dashed var(--primary); display: flex; flex-direction: column; gap: 12px; margin-top: 10px; text-align: center; }
        .key-icon { font-size: 40px; color: var(--primary); margin-bottom: 5px; }
        
        .btn-download {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--primary); color: #fff; padding: 14px; border-radius: 12px;
            text-decoration: none; font-weight: 800; font-size: 14px; transition: 0.3s;
            box-shadow: 0 4px 10px rgba(198, 156, 133, 0.3); font-family: 'Nunito', sans-serif;
        }
        .btn-download:hover { background: var(--primary-hover); transform: translateY(-2px); }

        .btn-get-key { background: var(--success); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 900; font-family: 'Nunito', sans-serif; cursor: pointer; transition: 0.3s; width: 100%; box-shadow: 0 5px 15px rgba(139, 168, 136, 0.3);}
        .btn-get-key:hover { background: var(--success-hover); transform: translateY(-2px); }

        .btn-history { background: var(--text-muted); color: white; border: none; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 800; font-family: 'Nunito', sans-serif; cursor: pointer; transition: 0.3s; width: 100%; }
        .btn-history:hover { background: var(--text-main); transform: translateY(-2px); }

        /* BẢNG KEY POPUP (MODAL) */
        .key-modal-overlay, .history-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 9999;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .key-modal, .history-modal {
            background: #fff; padding: 25px; border-radius: 20px; text-align: center;
            width: 90%; max-width: 320px; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; gap: 15px;
        }
        .history-modal { max-width: 360px; max-height: 80vh; }
        @keyframes bounceIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .key-modal h3, .history-modal h3 { margin: 0; color: var(--text-main); font-weight: 900; font-size: 18px; }
        .key-modal input {
            text-align: center; font-family: 'Fira Code', monospace; font-size: 15px; font-weight: 700;
            color: #D84315; padding: 12px; border-radius: 10px; border: 2px solid rgba(198, 156, 133, 0.3);
            background: var(--input-bg); width: 100%; box-sizing: border-box; outline: none;
        }
        
        /* Lịch sử List */
        .history-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; max-height: 300px; display: flex; flex-direction: column; gap: 10px; }
        .history-item { background: var(--input-bg); border: 1px solid rgba(198, 156, 133, 0.3); padding: 12px; border-radius: 12px; text-align: left; }
        .history-time { font-size: 12px; font-weight: 800; color: var(--text-muted); margin-bottom: 5px; display: flex; gap: 5px; align-items: center;}
        .history-key { font-family: 'Fira Code', monospace; font-size: 14.5px; font-weight: 900; color: #D84315; }
        .history-empty { font-size: 14px; font-weight: 700; color: var(--text-muted); padding: 20px 0; }

        .modal-buttons { display: flex; gap: 8px; justify-content: center; margin-top: 5px;}
        .btn-copy-modal { background: var(--success); color: #fff; border: none; padding: 10px 15px; border-radius: 12px; font-weight: 900; cursor: pointer; transition: 0.3s; flex: 1; font-family: 'Nunito', sans-serif; }
        .btn-copy-modal:hover { background: var(--success-hover); }
        .btn-close-modal { background: var(--text-muted); color: #fff; border: none; padding: 12px 15px; border-radius: 12px; font-weight: 900; cursor: pointer; transition: 0.3s; flex: 1; font-family: 'Nunito', sans-serif; width: 100%;}
        .btn-close-modal:hover { background: var(--text-main); }

        /* TAB DONATE CSS */
        .qr-generator { background: rgba(255, 255, 255, 0.7); border-radius: 15px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 15px; border: 1px solid rgba(198, 156, 133, 0.2); }
        .qr-generator h3 { margin: 0 0 12px 0; font-size: 15px; text-align: center; font-weight: 900;} 
        .form-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .form-row input { font-family: 'Nunito', sans-serif; padding: 10px; width: 100%; box-sizing: border-box; font-size: 13px; }
        .btn-generate { background: var(--primary); color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.3s; font-family: 'Nunito', sans-serif;}
        .btn-generate:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .qr-result { display: none; text-align: center; margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--primary); animation: fadeIn 0.4s ease; }
        .qr-result img { width: 100%; max-width: 200px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .qr-result p { font-size: 12px; font-weight: 800; color: var(--text-main); margin-top: 10px; }

        /* BẢNG XẾP HẠNG UI */
        .top-donate-box { background: rgba(255, 255, 255, 0.8); border-radius: 15px; padding: 15px; flex-grow: 1; border: 1px solid rgba(198, 156, 133, 0.2); }
        .top-donate-box h3 { margin: 0 0 12px 0; font-size: 16px; text-align: center; font-weight: 900; color: #d35400;} 
        .donate-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
        
        .donate-item { 
            display: flex; align-items: center; justify-content: space-between; 
            background: #fff; padding: 10px 12px; border-radius: 12px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.04); border: 1px solid rgba(198, 156, 133, 0.15); 
            transition: transform 0.2s; 
        }
        .donate-item:hover { transform: scale(1.02); }
        
        .donate-rank { width: 35px; text-align: center; flex-shrink: 0; display: flex; justify-content: center; align-items: center;}
        .rank-icon-1 { color: #FFD700; font-size: 22px; text-shadow: 0 2px 4px rgba(255,215,0,0.4); }
        .rank-icon-2 { color: #C0C0C0; font-size: 20px; text-shadow: 0 2px 4px rgba(192,192,192,0.4); }
        .rank-icon-3 { color: #CD7F32; font-size: 20px; text-shadow: 0 2px 4px rgba(205,127,50,0.4); }
        .rank-text { color: #B0BEC5; font-size: 14px; font-weight: 900; }

        .donate-info { flex-grow: 1; display: flex; justify-content: space-between; align-items: center; margin-left: 10px; min-width: 0; }
        .donate-text { display: flex; flex-direction: column; min-width: 0; flex-grow: 1; padding-right: 10px; }
        .donate-name { font-size: 13.5px; font-weight: 900; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .donate-msg { font-size: 11.5px; font-weight: 700; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } 
        .donate-amount { color: var(--success); font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 900; white-space: nowrap; flex-shrink: 0; } 
        
        .loading-text { text-align: center; font-size: 13px; color: var(--text-muted); font-weight: 700; padding: 15px; }

        /* POPUP SUCCESS THÔNG BÁO DONATE */
        .success-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 9999;
            display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .success-modal {
            background: #fff; padding: 25px; border-radius: 20px; text-align: center;
            width: 90%; max-width: 280px; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .check-wrap { position: relative; width: 70px; height: 70px; margin: 0 auto 15px; }
        .check-circle { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 4px dashed var(--success); border-radius: 50%; animation: spin 3s linear infinite; box-sizing: border-box; }
        .check-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 32px; color: var(--success); }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .success-modal h3 { margin: 0 0 5px 0; color: var(--success); font-weight: 900; font-size: 18px; }
        .success-modal p.name { font-size: 13px; color: var(--text-muted); font-weight: 700; margin: 5px 0; }
        .success-modal h1.amount { margin: 10px 0 20px 0; font-size: 24px; color: #D84315; font-family: 'Fira Code', monospace; } 
        .btn-ok { background: var(--success); color: #fff; border: none; padding: 10px 35px; border-radius: 15px; font-size: 14px; font-weight: 900; font-family: 'Nunito', sans-serif; cursor: pointer; transition: 0.3s; }
        .btn-ok:hover { background: var(--success-hover); transform: scale(1.05); }

    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(this, 'keyTab')"><i class="fa-solid fa-key"></i> Nhận Key</button>
        <button class="tab-btn" onclick="switchTab(this, 'donateTab')"><i class="fa-solid fa-crown"></i> Donate</button>
    </div>

    <!-- TAB 1: NHẬN KEY -->
    <div id="keyTab" class="tab-content active">
        <h2>0704Cheat - IPA 1H</h2>
        <p class="subtitle">Hệ thống cấp Key miễn phí tự động</p>
        
        <div class="key-container">
            <i class="fa-solid fa-download key-icon"></i>
            <a href="https://example.com" target="_blank" class="btn-download">
                <i class="fa-solid fa-cloud-arrow-down"></i> Link Tải IPA (Chuyển trang)
            </a>
            <hr style="border:0; border-top:1px dashed rgba(198,156,133,0.4); margin:5px 0;">
            <button class="btn-get-key" id="getKeyBtn">
                <i class="fa-solid fa-key"></i> Nhận Key Ngay
            </button>
            <button class="btn-history" onclick="openHistoryModal()">
                <i class="fa-solid fa-clock-rotate-left"></i> Lịch Sử Nhận Key
            </button>
        </div>
    </div>

    <!-- TAB 2: DONATE -->
    <div id="donateTab" class="tab-content">
        <div class="qr-generator">
            <h3><i class="fa-solid fa-bolt" style="color: #F4D03F;"></i> Chuyển Tiền Tự Động Xử Lý</h3>
            <div class="form-row"><input type="number" id="donateAmount" placeholder="Số tiền (Tùy tâm, VD: 20000)"></div>
            <div class="form-row" style="flex-direction: column;">
                <input type="text" id="donateName" placeholder="Tên hiển thị của bạn" maxlength="15">
                <input type="text" id="donateMessage" placeholder="Lời nhắn gửi (Tùy chọn)" maxlength="35">
            </div>
            <button class="btn-generate" onclick="generateDonateQR()"><i class="fa-solid fa-qrcode"></i> Lấy Mã QR Quét</button>
            <div class="qr-result" id="qrResultArea">
                <img id="qrImage" src="" alt="Mã QR Chuyển khoản">
                <p><i class="fa-solid fa-mobile-screen"></i> Quét mã này - Web tự nhận ngay sau vài giây</p>
            </div>
        </div>

        <div class="top-donate-box">
            <h3><i class="fa-solid fa-ranking-star"></i> BẢNG VÀNG DONATE</h3>
            <div id="loadingDonate" class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...</div>
            <ul class="donate-list" id="donateList"></ul>
        </div>
    </div>
</div>

<!-- BẢNG KEY POPUP HIỆN RA KHI ẤN NHẬN KEY -->
<div class="key-modal-overlay" id="keyModalOverlay">
    <div class="key-modal">
        <h3>Key 1 Giờ Của Bạn</h3>
        <input type="text" id="modalKeyInput" readonly>
        <div class="modal-buttons">
            <button class="btn-copy-modal" id="copyKeyBtn"><i class="fa-solid fa-copy"></i> Sao chép</button>
            <button class="btn-close-modal" style="flex:1;" onclick="closeKeyModal()"><i class="fa-solid fa-xmark"></i> Đóng</button>
        </div>
    </div>
</div>

<!-- BẢNG LỊCH SỬ NHẬN KEY POPUP -->
<div class="history-modal-overlay" id="historyModalOverlay">
    <div class="history-modal">
        <h3>Lịch Sử Nhận Key</h3>
        <ul class="history-list" id="historyList">
            <!-- Render ngầm từ JS -->
        </ul>
        <button class="btn-close-modal" style="margin-top: 10px;" onclick="closeHistoryModal()"><i class="fa-solid fa-xmark"></i> Đóng</button>
    </div>
</div>

<!-- MODAL PHÁO HOA THÀNH CÔNG DONATE -->
<div class="success-overlay" id="successOverlay">
    <div class="success-modal">
        <div class="check-wrap"><div class="check-circle"></div><i class="fa-solid fa-check check-icon"></i></div>
        <h3>Donate Thành Công!</h3>
        <p class="name" id="modalName">Cảm ơn Ẩn Danh</p>
        <h1 class="amount" id="modalAmount">+20.000đ</h1>
        <button class="btn-ok" onclick="closeSuccessModal()">OK</button>
    </div>
</div>

<script>
    function switchTab(btn, tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active'); btn.classList.add('active');
        if(tabId === 'donateTab') fetchTopDonate();
    }

    // --- PHẦN 1: LOGIC NHẬN KEY VÀ LƯU LỊCH SỬ ---
    let availableKeys = [];
    let keyHistory = JSON.parse(localStorage.getItem('keyHistory') || '[]');

    async function loadKeys() {
        try {
            const response = await fetch('keys.txt');
            if (response.ok) {
                const text = await response.text();
                availableKeys = text.split('\n').map(k => k.trim()).filter(k => k.length > 0);
            } else {
                availableKeys = ["0704-DEMO-1111-2222", "0704-DEMO-3333-4444", "0704-DEMO-5555-6666"];
            }
        } catch (e) {
            availableKeys = ["0704-DEMO-1111-2222", "0704-DEMO-3333-4444", "0704-DEMO-5555-6666"];
        }
    }
    loadKeys();

    function getCurrentDateTime() {
        const now = new Date();
        const pad = (n) => n.toString().padStart(2, '0');
        const date = `${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()}`;
        const time = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        return `${date} - ${time}`;
    }

    document.getElementById('getKeyBtn').addEventListener('click', function() {
        if (availableKeys.length === 0) {
            alert("Danh sách Key đang trống hoặc file keys.txt chưa được tải lên!");
            return;
        }
        
        // Random ra 1 key
        const randomIndex = Math.floor(Math.random() * availableKeys.length);
        const selectedKey = availableKeys[randomIndex];
        
        // Lưu lịch sử
        const historyItem = { key: selectedKey, time: getCurrentDateTime() };
        keyHistory.unshift(historyItem); // Đẩy lên đầu danh sách
        localStorage.setItem('keyHistory', JSON.stringify(keyHistory));

        // Hiện bảng Key
        document.getElementById('modalKeyInput').value = selectedKey;
        document.getElementById('keyModalOverlay').style.display = 'flex';
    });

    function closeKeyModal() { document.getElementById('keyModalOverlay').style.display = 'none'; }

    document.getElementById('copyKeyBtn').addEventListener('click', function() {
        const keyInput = document.getElementById('modalKeyInput');
        keyInput.select(); document.execCommand('copy');
        
        const btn = this; const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Đã chép'; btn.style.background = 'var(--text-main)';
        setTimeout(() => { btn.innerHTML = originalHtml; btn.style.background = 'var(--success)'; }, 2000);
    });

    // --- LOGIC BẢNG LỊCH SỬ ---
    function openHistoryModal() {
        const listUI = document.getElementById('historyList');
        listUI.innerHTML = '';

        if (keyHistory.length === 0) {
            listUI.innerHTML = '<div class="history-empty">Chưa có lịch sử nhận key nào.</div>';
        } else {
            keyHistory.forEach(item => {
                listUI.innerHTML += `
                    <li class="history-item">
                        <div class="history-time"><i class="fa-regular fa-clock"></i> ${item.time}</div>
                        <div class="history-key">${item.key}</div>
                    </li>
                `;
            });
        }
        document.getElementById('historyModalOverlay').style.display = 'flex';
    }

    function closeHistoryModal() { document.getElementById('historyModalOverlay').style.display = 'none'; }


    // --- PHẦN 2: QR & BẢNG XẾP HẠNG DONATE ---
    let nameMap = JSON.parse(localStorage.getItem('nameMap') || '{}');
    let msgMap = JSON.parse(localStorage.getItem('msgMap') || '{}');

    function makeKey(str) { return str ? str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').replace(/[^a-zA-Z0-9]/g, '').toUpperCase() : ""; }
    function removeAccentsForQR(str) { return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').replace(/[^a-zA-Z0-9 \-]/g, ''); }

    function generateDonateQR() {
        const amount = document.getElementById('donateAmount').value ? parseInt(document.getElementById('donateAmount').value) : null; 
        let rawName = document.getElementById('donateName').value.trim() || "Ẩn Danh";
        let rawMsg = document.getElementById('donateMessage').value.trim();
        
        let safeName = removeAccentsForQR(rawName).trim(); let safeMsg = removeAccentsForQR(rawMsg).trim();
        nameMap[makeKey(safeName)] = rawName; if (safeMsg) msgMap[makeKey(safeMsg)] = rawMsg;
        localStorage.setItem('nameMap', JSON.stringify(nameMap)); localStorage.setItem('msgMap', JSON.stringify(msgMap));

        let rawContent = `DONATE0704 ${safeName}` + (safeMsg ? ` - ${safeMsg}` : '');
        const params = new URLSearchParams();
        if (amount && amount > 0) params.append('amount', amount);
        params.append('addInfo', rawContent); params.append('accountName', 'NGO SON LAM');
        
        document.getElementById('qrImage').src = `https://img.vietqr.io/image/970422-0374583885-compact2.png?${params.toString()}`;
        document.getElementById('qrResultArea').style.display = 'block';
    }

    const _0xT = ['Mzc3NmEwYmUwMG', 'FlNTU3Yjg4ZTdjND', 'FmNWY5OGMwNmM='];
    let knownTransactionIds = new Set();
    let isFirstLoad = true;

    async function fetchTopDonate() {
        const listUI = document.getElementById('donateList'); const loader = document.getElementById('loadingDonate');
        try {
            const token = atob(_0xT.join('')); 
            const response = await fetch(`https://api.sieuthicode.net/historyapimbbank/${token}`);
            const json = await response.json();
            let txs = (json.TranList || []).filter(t => Number(t.creditAmount) > 0 && t.description && t.description.includes("DONATE0704"));

            if (txs.length === 0) { if(isFirstLoad) loader.innerHTML = "Chưa có dữ liệu. Hãy là người đầu tiên!"; return; }
            txs.forEach((tx, index) => { tx.originalIndex = index; });

            if (!isFirstLoad) {
                txs.forEach(tx => {
                    if (!knownTransactionIds.has(tx.refNo)) {
                        let parsedName = "Ẩn Danh"; 
                        let descText = tx.description.substring(tx.description.indexOf("DONATE0704") + 11).trim().replace(/TU\s*[:\-]?\s*ZION/gi, '').trim(); 
                        let parts = descText.split("-");
                        if(parts[0] && parts[0].trim() !== "") {
                            let key = makeKey(parts[0]);
                            if (nameMap[key]) { parsedName = nameMap[key]; } else { parsedName = parts[0].trim(); if(parsedName.toUpperCase() === "AN DANH") parsedName = "Ẩn Danh"; }
                        }
                        triggerSuccessPopup(Number(tx.creditAmount), parsedName);
                    }
                });
            }

            txs.forEach(tx => knownTransactionIds.add(tx.refNo)); isFirstLoad = false;
            txs.sort((a, b) => { const amountDiff = Number(b.creditAmount) - Number(a.creditAmount); if (amountDiff !== 0) return amountDiff; return a.originalIndex - b.originalIndex; });
            const topTxs = txs.slice(0, 10);
            loader.style.display = 'none'; let newHTML = '';

            topTxs.forEach((gd, index) => {
                const amountFormatted = "+" + Number(gd.creditAmount).toLocaleString('vi-VN') + 'đ';
                let extracted = gd.description.substring(gd.description.indexOf("DONATE0704") + 11).trim().replace(/TU\s*[:\-]?\s*ZION/gi, '').trim(); 
                let displayName = "Ẩn Danh"; let displayMsg = "";
                let parts = extracted.split("-");
                
                if (parts[0] && parts[0].trim() !== "") {
                    let bankName = parts[0].trim(); let key = makeKey(bankName);
                    if (nameMap[key]) { displayName = nameMap[key]; } else { displayName = bankName; if (displayName.toUpperCase() === "AN DANH") displayName = "Ẩn Danh"; }
                }
                if (parts.length > 1) { let bankMsg = parts.slice(1).join("-").trim(); let key = makeKey(bankMsg); if (msgMap[key]) { displayMsg = msgMap[key]; } else { displayMsg = bankMsg; } }
                
                const msgHtml = displayMsg ? `<span class="donate-msg"><i class="fa-regular fa-comment-dots"></i> ${displayMsg}</span>` : '';
                let rankHTML = '';
                if (index === 0) rankHTML = '<i class="fa-solid fa-crown rank-icon-1"></i>';
                else if (index === 1) rankHTML = '<i class="fa-solid fa-medal rank-icon-2"></i>';
                else if (index === 2) rankHTML = '<i class="fa-solid fa-award rank-icon-3"></i>';
                else rankHTML = `<span class="rank-text">#${index+1}</span>`;

                newHTML += `
                    <li class="donate-item">
                        <div class="donate-rank">${rankHTML}</div>
                        <div class="donate-info">
                            <div class="donate-text"><span class="donate-name">${displayName}</span>${msgHtml}</div>
                            <div class="donate-amount">${amountFormatted}</div>
                        </div>
                    </li>
                `;
            });
            listUI.innerHTML = newHTML;
        } catch (error) { console.error("Lỗi get data", error); }
    }

    setInterval(() => { if (document.getElementById('donateTab').classList.contains('active')) fetchTopDonate(); }, 4000);

    function triggerSuccessPopup(amount, name) {
        document.getElementById('modalName').innerText = `Cảm ơn ${name} ❤️`;
        document.getElementById('modalAmount').innerText = `+${amount.toLocaleString('vi-VN')}đ`;
        document.getElementById('successOverlay').style.display = 'flex';
        var duration = 3000, end = Date.now() + duration;
        (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#26ccff', '#a25afd', '#ff5e7e', '#88ff5a', '#fcff42'] });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#26ccff', '#a25afd', '#ff5e7e', '#88ff5a', '#fcff42'] });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }
    function closeSuccessModal() { document.getElementById('successOverlay').style.display = 'none'; }
</script>

</body>
