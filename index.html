<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Name Patcher & Donate 🧋</title>
    <!-- Thư viện Font & Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Thư viện Pháo Hoa -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --bg-page: #F5EAE0;
            --card-bg: rgba(255, 252, 248, 0.95);
            --text-main: #5C4B41;
            --text-muted: #8C7B70;
            --primary: #C69C85; 
            --primary-hover: #B0856D;
            --success: #8BA888; 
            --success-hover: #728F6F;
            --danger: #D28F8F;
            --input-bg: #FDF8F5;
            --tab-active: #9E877A;
            --tab-inactive: #D7C6B8;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #F5EAE0 0%, #EAD7C3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            color: var(--text-main);
            font-size: 13px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 20px 25px; 
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(92, 75, 65, 0.1);
            width: 100%;
            max-width: 480px; 
            border: 2px solid rgba(255, 255, 255, 0.7);
            display: flex;
            flex-direction: column;
            min-height: 600px;
        }

        /* TABS */
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; border-bottom: 2px solid rgba(198, 156, 133, 0.2); padding-bottom: 10px; }
        .tab-btn {
            flex: 1; background: none; border: none; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800;
            color: var(--tab-inactive); cursor: pointer; padding: 10px; border-radius: 10px; transition: all 0.3s;
        }
        .tab-btn.active { color: #fff; background: var(--tab-active); box-shadow: 0 4px 10px rgba(158, 135, 122, 0.3); }
        .tab-content { display: none; flex-direction: column; animation: fadeIn 0.4s ease; flex-grow: 1; }
        .tab-content.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        h2 { margin: 0 0 5px 0; font-size: 20px; font-weight: 900; text-align: center; } 
        p.subtitle { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 15px; font-weight: 700; } 

        /* SỬA TÊN & HEX VIEWER CSS */
        .file-upload label { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary); color: #fff; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 800; transition: 0.3s; font-size: 14px; }
        .file-upload label:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .file-upload input[type="file"] { display: none; }
        #fileName { display: block; text-align: center; margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--primary-hover); }
        .box-section { background: rgba(255, 255, 255, 0.6); padding: 15px; border-radius: 15px; border: 1px dashed var(--primary); display: none; flex-direction: column; gap: 12px; margin-top: 10px; }
        .input-group label { font-size: 13px; font-weight: 800; margin-bottom: 6px; display: block; }
        .input-with-btn { display: flex; gap: 8px; }
        input[type="text"], input[type="number"] { flex: 1; padding: 12px; border-radius: 10px; border: 2px solid rgba(198, 156, 133, 0.3); background: var(--input-bg); font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 600; outline: none; transition: 0.3s; }
        input[type="text"]:focus, input[type="number"]:focus { border-color: var(--primary); }
        input:disabled { background: #eaeaea; cursor: not-allowed; border-color: transparent; }
        button.btn-search { background: var(--text-muted); color: white; border: none; padding: 0 15px; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 13px;}
        button.btn-search:hover { background: var(--text-main); }
        .status-box { font-size: 13px; font-weight: 700; display: none; align-items: center; gap: 6px; }
        .counter { font-size: 12px; font-weight: 800; text-align: right; margin-top: 4px; }
        .counter.match { color: var(--success); } .counter.warning { color: #D98C00; } .counter.error { color: var(--danger); }
        
        .hex-viewer-container { display: none; background: #000000; border-radius: 10px; padding: 12px 15px; margin-top: 5px; overflow-x: auto; text-align: left; border: 1px solid rgba(255, 255, 255, 0.1); }
        .hex-header { font-size: 11px; color: #fff; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; opacity: 0.7; }
        .hex-body { font-family: 'Fira Code', monospace; font-size: 13px; color: #ffffff; white-space: pre; line-height: 1.5; }
        .hex-offset { color: #5B85D9; margin-right: 15px; }
        .hex-highlight { color: #FF3B30; font-weight: bold; background: rgba(255, 59, 48, 0.2); border-radius: 3px; }
        
        .btn-save { background: var(--success); color: white; border: none; padding: 14px; margin-top: 5px; border-radius: 12px; font-size: 15px; font-weight: 800; font-family: 'Nunito', sans-serif; cursor: pointer; transition: 0.3s; }
        .btn-save:hover:not(:disabled) { background: var(--success-hover); transform: translateY(-2px); }
        .btn-save:disabled { background: #ccc; cursor: not-allowed; }

        /* TAB DONATE CSS */
        .qr-generator { background: rgba(255, 255, 255, 0.7); border-radius: 15px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 15px; border: 1px solid rgba(198, 156, 133, 0.2); }
        .qr-generator h3 { margin: 0 0 12px 0; font-size: 15px; text-align: center; font-weight: 900;} 
        .form-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .form-row input { font-family: 'Nunito', sans-serif; padding: 10px; width: 100%; box-sizing: border-box; font-size: 13px; }
        .btn-generate { background: var(--primary); color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.3s; font-family: 'Nunito', sans-serif;}
        .btn-generate:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .qr-result { display: none; text-align: center; margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--primary); animation: fadeIn 0.4s ease; }
        .qr-result img { width: 100%; max-width: 200px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .qr-result p { font-size: 12px; font-weight: 800; color: var(--text-main); margin-top: 10px; }

        /* BẢNG XẾP HẠNG UI (Số tiền căn giữa theo chiều dọc) */
        .top-donate-box { background: rgba(255, 255, 255, 0.8); border-radius: 15px; padding: 15px; flex-grow: 1; border: 1px solid rgba(198, 156, 133, 0.2); }
        .top-donate-box h3 { margin: 0 0 12px 0; font-size: 16px; text-align: center; font-weight: 900; color: #d35400;} 
        .donate-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
        
        .donate-item { 
            display: flex; align-items: center; justify-content: space-between; 
            background: #fff; padding: 10px 12px; border-radius: 12px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.04); border: 1px solid rgba(198, 156, 133, 0.15); 
            transition: transform 0.2s; 
        }
        .donate-item:hover { transform: scale(1.02); }
        
        .donate-rank { width: 35px; text-align: center; flex-shrink: 0; display: flex; justify-content: center; align-items: center;}
        .rank-icon-1 { color: #FFD700; font-size: 22px; text-shadow: 0 2px 4px rgba(255,215,0,0.4); }
        .rank-icon-2 { color: #C0C0C0; font-size: 20px; text-shadow: 0 2px 4px rgba(192,192,192,0.4); }
        .rank-icon-3 { color: #CD7F32; font-size: 20px; text-shadow: 0 2px 4px rgba(205,127,50,0.4); }
        .rank-text { color: #B0BEC5; font-size: 14px; font-weight: 900; }

        /* Vùng hiển thị Tên & Lời nhắn bên trái, Số tiền bên phải */
        .donate-info { 
            flex-grow: 1; display: flex; justify-content: space-between; align-items: center; 
            margin-left: 10px; min-width: 0; 
        }
        
        .donate-text { display: flex; flex-direction: column; min-width: 0; flex-grow: 1; padding-right: 10px; }
        .donate-name { font-size: 13.5px; font-weight: 900; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .donate-msg { font-size: 11.5px; font-weight: 700; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } 
        
        .donate-amount { color: var(--success); font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 900; white-space: nowrap; flex-shrink: 0; } 
        
        .loading-text { text-align: center; font-size: 13px; color: var(--text-muted); font-weight: 700; padding: 15px; }

        /* POPUP SUCCESS THÔNG BÁO DONATE */
        .success-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 9999;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .success-modal {
            background: #fff; padding: 25px; border-radius: 20px; text-align: center;
            width: 90%; max-width: 280px; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes bounceIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .check-wrap { position: relative; width: 70px; height: 70px; margin: 0 auto 15px; }
        .check-circle { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: 4px dashed var(--success); border-radius: 50%;
            animation: spin 3s linear infinite; box-sizing: border-box;
        }
        .check-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 32px; color: var(--success); }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .success-modal h3 { margin: 0 0 5px 0; color: var(--success); font-weight: 900; font-size: 18px; }
        .success-modal p.name { font-size: 13px; color: var(--text-muted); font-weight: 700; margin: 5px 0; }
        .success-modal h1.amount { margin: 10px 0 20px 0; font-size: 24px; color: #D84315; font-family: 'Fira Code', monospace; } 
        .btn-ok { background: var(--success); color: #fff; border: none; padding: 10px 35px; border-radius: 15px; font-size: 14px; font-weight: 900; font-family: 'Nunito', sans-serif; cursor: pointer; transition: 0.3s; }
        .btn-ok:hover { background: var(--success-hover); transform: scale(1.05); }

    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(this, 'editTab')"><i class="fa-solid fa-file-signature"></i> Hex Patcher</button>
        <button class="tab-btn" onclick="switchTab(this, 'donateTab')"><i class="fa-solid fa-crown"></i> Bảng Vàng</button>
    </div>

    <!-- TAB 1: SỬA TÊN -->
    <div id="editTab" class="tab-content active">
        <h2>0704Cheat - Patch</h2>
        <p class="subtitle">Hex Edit File 1.0.0</p>
        <div class="file-upload">
            <label for="fileInput"><i class="fa-solid fa-folder-open"></i> Chọn file .bytes / .txt</label>
            <input type="file" id="fileInput">
            <span id="fileName">Chưa có file nào được nạp</span>
        </div>
        <div class="box-section" id="boxSection">
            <div class="input-group">
                <label>1. Tên cũ cần thay:</label>
                <div class="input-with-btn"><input type="text" id="oldNameInput" placeholder="VD: 0704"><button class="btn-search" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i> Tìm</button></div>
            </div>
            <div class="status-box" id="statusBox"><i class="fa-solid fa-circle-check"></i> <span id="statusText"></span></div>
            <div class="hex-viewer-container" id="hexViewerContainer">
                <div class="hex-header"><span><i class="fa-solid fa-search"></i> Memory Search Result</span></div>
                <div class="hex-body" id="hexBody"></div>
            </div>
            <div class="input-group" style="margin-top: 5px;">
                <label>2. Tên mới (Sẽ tự bù Null nếu ngắn hơn):</label>
                <input type="text" id="newNameInput" placeholder="Nhập tên..." disabled>
                <div class="counter match" id="charCounter">0/0 kí tự</div>
            </div>
            <button class="btn-save" id="saveBtn" disabled><i class="fa-solid fa-download"></i> Lưu File Đã Fix</button>
        </div>
    </div>

    <!-- TAB 2: DONATE -->
    <div id="donateTab" class="tab-content">
        <div class="qr-generator">
            <h3><i class="fa-solid fa-bolt" style="color: #F4D03F;"></i> Chuyển Tiền Tự Động Xử Lý</h3>
            <div class="form-row"><input type="number" id="donateAmount" placeholder="Số tiền (Tùy tâm, VD: 20000)"></div>
            <div class="form-row" style="flex-direction: column;">
                <input type="text" id="donateName" placeholder="Tên hiển thị của bạn" maxlength="15">
                <input type="text" id="donateMessage" placeholder="Lời nhắn gửi (Tùy chọn)" maxlength="35">
            </div>
            <button class="btn-generate" onclick="generateDonateQR()"><i class="fa-solid fa-qrcode"></i> Lấy Mã QR Quét</button>
            <div class="qr-result" id="qrResultArea">
                <img id="qrImage" src="" alt="Mã QR Chuyển khoản">
                <p><i class="fa-solid fa-mobile-screen"></i> Quét mã này - Web tự nhận ngay sau vài giây</p>
            </div>
        </div>

        <div class="top-donate-box">
            <h3><i class="fa-solid fa-ranking-star"></i> BẢNG VÀNG DONATE</h3>
            <div id="loadingDonate" class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...</div>
            <ul class="donate-list" id="donateList"></ul>
        </div>
    </div>
</div>

<!-- MODAL PHÁO HOA THÀNH CÔNG -->
<div class="success-overlay" id="successOverlay">
    <div class="success-modal">
        <div class="check-wrap"><div class="check-circle"></div><i class="fa-solid fa-check check-icon"></i></div>
        <h3>Donate Thành Công!</h3>
        <p class="name" id="modalName">Cảm ơn Ẩn Danh</p>
        <h1 class="amount" id="modalAmount">+20.000đ</h1>
        <button class="btn-ok" onclick="closeSuccessModal()">OK</button>
    </div>
</div>

<script>
    function switchTab(btn, tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active'); btn.classList.add('active');
        if(tabId === 'donateTab') fetchTopDonate();
    }

    // --- PHẦN 1: HEX PATCHER ---
    const fileInput = document.getElementById('fileInput'), boxSection = document.getElementById('boxSection');
    const oldNameInput = document.getElementById('oldNameInput'), searchBtn = document.getElementById('searchBtn');
    const statusBox = document.getElementById('statusBox'), statusText = document.getElementById('statusText');
    const newNameInput = document.getElementById('newNameInput'), charCounter = document.getElementById('charCounter');
    const saveBtn = document.getElementById('saveBtn'), hexViewerContainer = document.getElementById('hexViewerContainer'), hexBody = document.getElementById('hexBody');
    let fileBuffer = null, foundOffsets = [], currentFileName = '', targetLength = 0; const encoder = new TextEncoder();
    
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0]; if (!file) return;
        currentFileName = file.name; document.getElementById('fileName').innerHTML = `<i class="fa-solid fa-check"></i> Đang xử lý: ${currentFileName}`;
        const reader = new FileReader();
        reader.onload = function(event) {
            fileBuffer = event.target.result; boxSection.style.display = 'flex'; statusBox.style.display = 'none';
            hexViewerContainer.style.display = 'none'; newNameInput.disabled = true; saveBtn.disabled = true; newNameInput.value = ''; charCounter.textContent = '0/0 kí tự';
        }; reader.readAsArrayBuffer(file);
    });

    searchBtn.addEventListener('click', function() {
        const oldName = oldNameInput.value; if (!oldName) return;
        const searchBytes = encoder.encode(oldName); targetLength = searchBytes.length;
        const uint8 = new Uint8Array(fileBuffer); foundOffsets = [];
        for (let i = 0; i <= uint8.length - targetLength; i++) {
            let match = true;
            for (let j = 0; j < targetLength; j++) { if (uint8[i + j] !== searchBytes[j]) { match = false; break; } }
            if (match) foundOffsets.push(i);
        }
        statusBox.style.display = 'flex';
        if (foundOffsets.length > 0) {
            statusBox.style.color = 'var(--success)'; statusText.innerHTML = `Đã tìm thấy: <b>${oldName}</b> (ở ${foundOffsets.length} chỗ)`;
            renderHexDump(fileBuffer, foundOffsets[0], targetLength);
            newNameInput.disabled = false; newNameInput.value = ''; validateAndPad();
        } else {
            statusBox.style.color = 'var(--danger)'; statusText.innerHTML = `Không tìm thấy trong file!`; hexViewerContainer.style.display = 'none'; newNameInput.disabled = true;
        }
    });

    function renderHexDump(buffer, offset, matchLen) {
        const uint8 = new Uint8Array(buffer);
        let start = Math.floor(Math.max(0, offset - 16) / 8) * 8, end = Math.min(uint8.length, start + 64), hexHTML = '';
        for (let i = start; i < end; i += 8) {
            let rowOffset = i.toString(16).padStart(8, '0').toUpperCase(), rowAscii = '';
            for (let j = 0; j < 8; j++) {
                if (i + j < uint8.length) {
                    let byte = uint8[i + j], isMatch = (i + j >= offset && i + j < offset + matchLen);
                    let char = (byte >= 32 && byte <= 126) ? String.fromCharCode(byte) : '.';
                    if (char === '<') char = '&lt;'; if (char === '>') char = '&gt;';
                    rowAscii += isMatch ? `<span class="hex-highlight">${char}</span> ` : `${char} `;
                }
            }
            hexHTML += `<span class="hex-offset">${rowOffset}</span>${rowAscii.trimEnd()}\n`;
        }
        hexBody.innerHTML = hexHTML; hexViewerContainer.style.display = 'block';
    }

    newNameInput.addEventListener('input', validateAndPad);
    function validateAndPad() {
        const len = encoder.encode(newNameInput.value).length;
        charCounter.textContent = `${len}/${targetLength} kí tự` + (len > targetLength ? ' (Quá!)' : '');
        charCounter.className = len === targetLength ? 'counter match' : (len < targetLength ? 'counter warning' : 'counter error');
        saveBtn.disabled = len > targetLength;
    }

    saveBtn.addEventListener('click', function() {
        const inputBytes = encoder.encode(newNameInput.value), outputUint8 = new Uint8Array(fileBuffer.slice(0));
        let finalBytes = new Uint8Array(targetLength);
        for(let i = 0; i < targetLength; i++) finalBytes[i] = i < inputBytes.length ? inputBytes[i] : 0x00;
        foundOffsets.forEach(offset => { for (let i = 0; i < targetLength; i++) outputUint8[offset + i] = finalBytes[i]; });
        const blob = new Blob([outputUint8], { type: "application/octet-stream" });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "FixedName_" + currentFileName; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    });


    // --- PHẦN 2: QR & BẢNG XẾP HẠNG ---
    function generateDonateQR() {
        const amount = document.getElementById('donateAmount').value ? parseInt(document.getElementById('donateAmount').value) : null; 
        
        let rawName = document.getElementById('donateName').value.trim() || "An Danh";
        let message = document.getElementById('donateMessage').value.trim();
        
        let rawContent = `DONATE0704 ${rawName}` + (message ? ` - ${message}` : '');
        
        const safeContent = rawContent.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').replace(/[^a-zA-Z0-9 \-]/g, '').trim();
        const params = new URLSearchParams();
        if (amount && amount > 0) params.append('amount', amount);
        params.append('addInfo', safeContent); params.append('accountName', 'NGO SON LAM');
        
        document.getElementById('qrImage').src = `https://img.vietqr.io/image/970422-0364583885-compact2.png?${params.toString()}`;
        document.getElementById('qrResultArea').style.display = 'block';
    }

    const _0xT = ['Mzc3NmEwYmUwMG', 'FlNTU3Yjg4ZTdjND', 'FmNWY5OGMwNmM='];
    let knownTransactionIds = new Set();
    let isFirstLoad = true;

    async function fetchTopDonate() {
        const listUI = document.getElementById('donateList');
        const loader = document.getElementById('loadingDonate');

        try {
            const token = atob(_0xT.join('')); 
            const response = await fetch(`https://api.sieuthicode.net/historyapimbbank/${token}`);
            const json = await response.json();
            
            let txs = (json.TranList || []).filter(t => Number(t.creditAmount) > 0 && t.description && t.description.includes("DONATE0704"));

            if (txs.length === 0) {
                if(isFirstLoad) loader.innerHTML = "Chưa có dữ liệu. Hãy là người đầu tiên!";
                return;
            }

            // AUTO CHECK PHÁO HOA
            if (!isFirstLoad) {
                txs.forEach(tx => {
                    if (!knownTransactionIds.has(tx.refNo)) {
                        let parsedName = "Ẩn Danh"; 
                        let descText = tx.description.substring(tx.description.indexOf("DONATE0704") + 11).trim();
                        descText = descText.replace(/TU\s*[:\-]?\s*ZION/gi, '').trim(); 
                        let parts = descText.split("-");
                        if(parts[0].trim() && parts[0].trim().toUpperCase() !== "AN DANH") {
                            parsedName = parts[0].trim();
                        }
                        triggerSuccessPopup(Number(tx.creditAmount), parsedName);
                    }
                });
            }

            txs.forEach(tx => knownTransactionIds.add(tx.refNo));
            isFirstLoad = false;

            txs.sort((a, b) => Number(b.creditAmount) - Number(a.creditAmount));
            const topTxs = txs.slice(0, 10);

            loader.style.display = 'none';
            let newHTML = '';

            topTxs.forEach((gd, index) => {
                const amountFormatted = "+" + Number(gd.creditAmount).toLocaleString('vi-VN') + 'đ';
                
                let extracted = gd.description.substring(gd.description.indexOf("DONATE0704") + 11).trim();
                extracted = extracted.replace(/TU\s*[:\-]?\s*ZION/gi, '').trim(); 
                
                // --- PHẦN LẤY TÊN THEO NGƯỜI NHẬP QR ---
                let displayName = "Ẩn Danh"; 
                let displayMsg = "";
                
                let parts = extracted.split("-");
                if (parts[0] && parts[0].trim() !== "") {
                    displayName = parts[0].trim();
                    if (displayName.toUpperCase() === "AN DANH") {
                        displayName = "Ẩn Danh";
                    }
                }
                
                if (parts.length > 1) {
                    displayMsg = parts.slice(1).join("-").trim();
                }

                // Dùng Layout Mới: Tên + Lời nhắn vào chung 1 khối text
                const msgHtml = displayMsg ? `<span class="donate-msg"><i class="fa-regular fa-comment-dots"></i> ${displayMsg}</span>` : '';

                let rankHTML = '';
                if (index === 0) rankHTML = '<i class="fa-solid fa-crown rank-icon-1"></i>';
                else if (index === 1) rankHTML = '<i class="fa-solid fa-medal rank-icon-2"></i>';
                else if (index === 2) rankHTML = '<i class="fa-solid fa-award rank-icon-3"></i>';
                else rankHTML = `<span class="rank-text">#${index+1}</span>`;

                newHTML += `
                    <li class="donate-item">
                        <div class="donate-rank">${rankHTML}</div>
                        <div class="donate-info">
                            <!-- Khối Tên và Lời Nhắn (Bên Trái) -->
                            <div class="donate-text">
                                <span class="donate-name">${displayName}</span>
                                ${msgHtml}
                            </div>
                            <!-- Khối Số Tiền (Bên Phải, tự động được đẩy ra giữa theo chiều dọc) -->
                            <div class="donate-amount">${amountFormatted}</div>
                        </div>
                    </li>
                `;
            });
            listUI.innerHTML = newHTML;

        } catch (error) { console.error("Lỗi get data", error); }
    }

    setInterval(() => {
        if (document.getElementById('donateTab').classList.contains('active')) fetchTopDonate();
    }, 4000);

    function triggerSuccessPopup(amount, name) {
        document.getElementById('modalName').innerText = `Cảm ơn ${name} ❤️`;
        document.getElementById('modalAmount').innerText = `+${amount.toLocaleString('vi-VN')}đ`;
        document.getElementById('successOverlay').style.display = 'flex';
        
        var duration = 3000, end = Date.now() + duration;
        (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#26ccff', '#a25afd', '#ff5e7e', '#88ff5a', '#fcff42'] });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#26ccff', '#a25afd', '#ff5e7e', '#88ff5a', '#fcff42'] });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }
    function closeSuccessModal() { document.getElementById('successOverlay').style.display = 'none'; }
</script>

</body>
</html>
